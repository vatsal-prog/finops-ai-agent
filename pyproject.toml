[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-ai-agent"
version = "0.3.0"
description = "FinOps Agent — cloud cost optimization with custom MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FinOps Agent Contributors" }]
dependencies = [
  "mcp>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finops-mcp = "finops_agent.mcp_server:main"
finops-agent = "finops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
